# Builds and publishes the Ubuntu/Linux x64 AppImage from this fork.
#
# Why this exists separately from release-cut.yml: the upstream release-cut
# workflow drives a full three-platform cut with Apple notarization and
# SignPath approval waits, and publishes into stablyai/orca. Neither the
# signing credentials nor the target repo apply here, so this fork ships the
# one artifact it actually needs — orca-linux.AppImage — on demand.
#
# Why ORCA_RELEASE_REPO is set for both the app build and the packaging step:
# the packaged updater resolves its feed from that constant (compiled into the
# main bundle by electron-vite) and electron-builder writes the matching
# app-update.yml / latest-linux.yml from the same value. If only one of the two
# were set, an installed build would check upstream's releases for updates and
# try to install upstream binaries over this fork's.
name: ERLI Linux release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Branch, tag or SHA to build. Leave empty to build the ref this
          workflow was launched from, which is almost always what you want —
          an upstream tag has no ORCA_RELEASE_REPO plumbing and is rejected by
          the guard below.
        required: false
        default: ''
        type: string
      prerelease:
        description: >-
          Mark the GitHub release as a prerelease. Leave off for builds that
          should be picked up by the in-app updater — it resolves
          /releases/latest/download, which skips prereleases.
        required: false
        default: false
        type: boolean

concurrency:
  group: erli-linux-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    env:
      ORCA_RELEASE_REPO: ${{ github.repository }}
      # Every capability `src/shared/disabled-capabilities.ts` knows how to turn
      # off. These all either reach stablyai-operated services or hand a
      # corporate checkout to one, which a build shipped on company machines has
      # no business doing. An id not listed there fails the build.
      ORCA_DISABLED_CAPABILITIES: >-
        artifacts,computer-use,crash-report,feedback,mobile,orca-account,plugins,privacy,servers,share-skills,star-prompt,whats-new

    steps:
      # Why the `||`: an empty `ref` input must fall through to checkout's own
      # default (the ref the run was dispatched from), not to an empty string.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Why fail here rather than let the build succeed: without the
      # ORCA_RELEASE_REPO plumbing the packaged updater keeps upstream's
      # hard-coded feed, so the AppImage would offer — and install — stablyai
      # builds over this one. That is invisible until a user's first update.
      - name: Verify the checked-out tree honours this build's ERLI settings
        run: |
          set -euo pipefail
          missing=0
          for constant in ORCA_RELEASE_REPO ORCA_DISABLED_CAPABILITIES; do
            if ! grep -q "$constant" electron.vite.config.ts; then
              echo "::error::This ref predates the $constant plumbing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Build a branch that carries the ERLI build constants, not a bare upstream tag."
            exit 1
          fi

      # pnpm must be on PATH before setup-node so setup-node can locate the store for caching.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      # Why: pnpm's bundled node-gyp fails the native-module postinstall on
      # Linux runners. Upstream's release and PR jobs pin an external copy for
      # the same reason — keep this in step with them.
      - name: Use external node-gyp to avoid pnpm's bundled copy
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      # Why: `pnpm build:release` verifies the Linux computer-use provider by
      # importing AT-SPI bindings, which are runtime package deps but are not
      # present on stock GitHub Ubuntu runners.
      - name: Install Linux computer-use provider dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool xvfb

      # Cache the Electron binary + electron-builder tool downloads (AppImage
      # runtime). Saves ~30-90s per run.
      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-linux-x64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-linux-x64-

      # Why the retry: electron's postinstall downloads the Electron binary from
      # GitHub release assets, and that CDN intermittently returns 504s.
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      # Why the run number in the tag: package.json carries the upstream version
      # this fork is synced to, so several fork builds can share it. The `erli-`
      # prefix keeps these tags out of the way of upstream's `v*` tags, which
      # land in this repo whenever the fork syncs.
      - name: Resolve version and tag
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="erli-v${version}-${GITHUB_RUN_NUMBER}"
          # Why not github.sha: that is the SHA of the ref the workflow file came
          # from, which differs from the built ref whenever `ref` is overridden.
          sha="$(git rev-parse HEAD)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "Building $version from $sha as $tag"

      - name: Build app
        run: pnpm build:release
        env:
          # Why: Vite's web build crosses Node's default old-space ceiling.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package AppImage
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 30
          command: >-
            node config/scripts/ensure-native-runtime.mjs --runtime=electron &&
            pnpm exec electron-builder --config config/electron-builder.config.cjs
            --linux AppImage --x64 --publish never

      # Why an explicit check rather than trusting `gh release upload` to fail:
      # latest-linux.yml is a side effect of having a publish provider
      # configured, not of the AppImage target. If a config change ever drops
      # it, the release would still publish and would silently stop feeding the
      # in-app updater.
      - name: Verify release artifacts
        run: |
          set -euo pipefail
          missing=0
          for f in dist/orca-linux.AppImage dist/latest-linux.yml; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing expected artifact: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "dist/ contains:"
            ls -la dist
            exit 1
          fi
          grep -q "orca-linux.AppImage" dist/latest-linux.yml
          ls -la dist/orca-linux.AppImage dist/latest-linux.yml

      # Why unpack rather than launch: a GUI smoke test needs a display server
      # and a working sandbox, which is a much larger surface than this job
      # needs. Unpacking proves the squashfs is intact and that the payload the
      # runtime would exec is actually inside it — the failure modes that would
      # otherwise ship a download that dies on first click.
      - name: Smoke-test the AppImage payload
        run: |
          set -euo pipefail
          chmod +x dist/orca-linux.AppImage
          work="$(mktemp -d)"
          cp dist/orca-linux.AppImage "$work/"
          (cd "$work" && ./orca-linux.AppImage --appimage-extract >/dev/null)
          for f in AppRun orca-ide resources/app.asar; do
            if [ ! -e "$work/squashfs-root/$f" ]; then
              echo "::error::AppImage payload is missing $f"
              find "$work/squashfs-root" -maxdepth 2 | head -50
              exit 1
            fi
          done
          echo "AppImage payload OK"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ steps.version.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="$(
            cat <<EOF
          Unofficial Linux x64 build of Orca \`$VERSION\`, packaged by ERLI from $TARGET.

          ## Install

          \`\`\`bash
          curl -L -o orca-linux.AppImage \\
            https://github.com/$REPO/releases/download/$TAG/orca-linux.AppImage
          chmod +x orca-linux.AppImage
          ./orca-linux.AppImage
          \`\`\`

          On a headless host add \`--appimage-extract-and-run --no-sandbox\`.

          Not built or signed by stablyai. Notes for the upstream version are at
          https://github.com/stablyai/orca/releases.
          EOF
          )"
          args=(--title "Orca $VERSION (ERLI build ${GITHUB_RUN_NUMBER})" --notes "$notes" --target "$TARGET")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          assets=(dist/orca-linux.AppImage dist/latest-linux.yml)
          # electron-builder emits a blockmap for delta downloads; it is not
          # required for the updater to work, so ship it only when present.
          if [ -f dist/orca-linux.AppImage.blockmap ]; then
            assets+=(dist/orca-linux.AppImage.blockmap)
          fi
          gh release create "$TAG" "${args[@]}" "${assets[@]}"
          gh release view "$TAG" --json url --jq .url
